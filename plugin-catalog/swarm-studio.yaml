name: swarm-studio
title: Swarm Studio
repo: https://github.com/Pukujan/swarm-studio
sha: bac4e4fefc6c4e2f031b1371930ad88766577515
version: "0.2.0"
description: "A crew of agents builds a whole launch from one prompt, live on a canvas you can watch and steer: a multi-page website, a working web app with a database, a playable game (also as a Godot, Unity or Unreal project), a promo film and social posts. Builds can go to Swarm Feed, where others remix them and every maker is credited. Disclosure: starts a local Node server on 127.0.0.1:4319 that keeps running after Hermes closes (token-protected, localhost only); calls the chat endpoint you configure (InferHub by default) and your Hermes image and vision providers; the canvas loads Tailwind and Google Fonts from their CDNs; app and game builds run pnpm install and the built app locally; Publish uses your gh CLI, or a Vercel or Cloudflare token you connect, stored in $HERMES_HOME/swarm-studio/connections.json with mode 0600."
maintainer: Pukujan
tier: community
category: tools
requires_hermes: ">=0.23"
docs_url: https://github.com/Pukujan/swarm-studio#readme
readme: true
screenshots:
  - https://raw.githubusercontent.com/Pukujan/swarm-studio/bac4e4fefc6c4e2f031b1371930ad88766577515/docs/catalog/studio-home.png
  - https://raw.githubusercontent.com/Pukujan/swarm-studio/bac4e4fefc6c4e2f031b1371930ad88766577515/docs/catalog/studio-canvas.png
platforms: [macos, linux]
capabilities:
  provides_tools: [swarm_design, swarm_canvas, swarm_studio]
  provides_hooks: []
  provides_middleware: []
  requires_env: [SWARM_STUDIO_API_KEY]
